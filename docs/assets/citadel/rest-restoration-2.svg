  <path d="M155 169h9v25h-9zM256 169h9v25h-9z" fill="#372634" stroke="#806070" stroke-width="1.5"/>
  <path d="M152 193h17v3h-17zM252 193h17v3h-17z" fill="#1b1726" stroke="#9a756e" stroke-width="1"/>
