  <path d="M393 58Q417 31 441 58V132H393Z" fill="#382b43" fill-opacity=".42" stroke="#ba9889" stroke-opacity=".55" stroke-width="2"/>
  <!-- Small lamps at fixed wall points; lighting does not cover text or the castle exterior. -->
  <ellipse cx="98" cy="91" rx="55" ry="51" fill="url(#warm)"/>
  <ellipse cx="378" cy="91" rx="55" ry="51" fill="url(#warm)"/>
