<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200">
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#6e5067" stop-opacity=".16"/><stop offset="1" stop-color="#b3846d" stop-opacity=".08"/></linearGradient>
    <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#806052"/><stop offset=".5" stop-color="#503643"/><stop offset="1" stop-color="#211c32"/></linearGradient>
    <linearGradient id="bed" x2="0" y2="1"><stop stop-color="#e2caba"/><stop offset="1" stop-color="#856c84"/></linearGradient>
    <radialGradient id="warm"><stop stop-color="#f6bf78" stop-opacity=".48"/><stop offset="1" stop-color="#f6bf78" stop-opacity="0"/></radialGradient>
